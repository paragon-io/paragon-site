<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARAGON | Official Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .badge {
      background: rgba(0, 240, 255, 0.1);
      color: #00f0ff;
      border: 1px solid #00f0ff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 3.2rem;
      letter-spacing: 6px;
      background: linear-gradient(90deg, #00f0ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    p {
      color: #a0a0b8;
      max-width: 450px;
      line-height: 1.6;
      margin-bottom: 30px;
      font-size: 1rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(10px);
    }
    .card h3 { margin-bottom: 8px; color: #fff; }
    .card span { font-size: 13px; color: #00f0ff; }
  </style>
</head>
<body>
  <div class="badge">● Server Online</div>
  <h1>PARAGON</h1>
  <p>Welcome to my official digital universe. Original AI music, creative projects, and more coming soon.</p>
  <div class="card">
    <h3>🎵 Music Studio</h3>
    <span>Suno AI Tracks Launching Soon...</span>
  </div>
</body>
</html>
